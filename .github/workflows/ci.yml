# 三平台 CI（照核心仓库、终端仓库那一份）：格式、clippy、文档、测试、行数。这个包只走协议，不依赖核心的 crate。
name: CI

on:
  push:
    branches: [main, "step/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
      - name: 格式
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: 文档
        run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: 测试
        run: cargo test --locked --no-fail-fast
      - name: 行数（每个 .rs 不超过 500 行，测试也算）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          over=$(find src tests -name '*.rs' -print0 2>/dev/null | xargs -0 wc -l | awk '$2 != "total" && $1 > 500 {print}')
          if [ -n "$over" ]; then echo "超过 500 行：" && echo "$over" && exit 1; fi
