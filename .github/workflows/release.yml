# 发版（照官方打包模板，同 miyu-embed、miyu-im）：推 `v*` 标签（v 加上 package/package.toml 里的版本）时一种系统打一个
# `.miyu`（`miyu pkg pack` 打的，软件源只收这种），传进这个标签的 Release；软件源每天收一次，收进索引以后
# `miyu pkg install memes` 就装得上（包编号 `memes`，11-12 起不带 miyu-；程序照旧叫 miyu-memes）。表情包：本仓库编的 miyu-memes 程序，加上 package/ 里的清单、后台页、给 im 的那一份；本仓库的许可证随包发（AGPL，发布前审计 LIC-2）。
# Linux aarch64 等 CI 测上了再加（同 im）。
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: memes
      folder: package
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.os }}
      build: |
        set -euo pipefail
        rustup toolchain install
        cargo build --release --locked -p miyu-memes
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        mkdir -p package/bin
        cp "target/release/miyu-memes$exe" "package/bin/miyu-memes$exe"
        cp LICENSE package/LICENSE
