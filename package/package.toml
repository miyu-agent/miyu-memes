# 表情包（设计：核心仓库 docs/designs/34-表情包.md）。给人看的字，不发给模型。

[package]
version = "0.1.0"
protocol = [1, 1]
name = { en = "Memes", zh = "表情包", ja = "スタンプ" }
summary = { en = "She saves, finds and sends stickers", zh = "她能存、找、发表情包", ja = "スタンプを保存・検索・送信する" }
icon = "face-slightly-smiling"
# 整个包围着图转：显示不了图片的会话（语音）里整包当没开（核心施工 X-25）。
needs = ["images"]

[command]
name = "memes"
program = "miyu-memes"
about = { en = "Memes package", zh = "表情包", ja = "スタンプ" }

[process]
args = ["serve"]
start = "always"
# tools：五件工具；context.inject：每一轮掷一次，中了往她要回的那句话后面加一句提醒（user.append）；packages.call：提醒以前问 im
# 的 chat.venue 这个场所开没开表情包（设计 34 第二节第 9 条）。
capabilities = ["tools", "context.inject", "packages.call"]

# 给别的软件调（核心施工 X-18）：接入QQ 以后「偷表情包」经它放图、按意思找。
[page]
dir = "page"

# im 的插件（设计 34 第二节第 9 条，项目主人 10-24 定；im 的包编号 10-30 起是 miyu-im，核心设计 48）：出现在 im 的插件页，场所卡片上能按群开关（默认开）；从插件卡片「打开面板」
# 进的就是上面的后台页。
[content.miyu-im]
dir = "im"

[export]
methods = ["add", "search"]

[settings.reminder]
type = "bool"
default = true
layers = ["system"]
applies = "now"
name = { en = "Remind her to send stickers", zh = "自动提醒发表情包", ja = "スタンプを送るようリマインド" }

[settings.reminder_probability]
type = "int"
min = 0
max = 100
default = 3
layers = ["system"]
applies = "now"
name = { en = "Chance per reply (%)", zh = "每次回复提醒的概率（%）", ja = "返信ごとのリマインド確率（%）" }

[settings.max_size_mb]
type = "int"
min = 1
max = 20
default = 5
layers = ["system"]
applies = "now"
name = { en = "Largest image (MiB)", zh = "单张上限（MiB）", ja = "画像の上限（MiB）" }
